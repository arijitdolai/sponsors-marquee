<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Marquee</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #d7d5d5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .marquee-outer {
    width: 100%;
    padding: 2rem 0;
  }

  .marquee-wrap {
    max-width: 100%;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 25s linear infinite;
  }

  .logo-card {
    flex-shrink: 0;
    width: 120px;
    aspect-ratio: 1 / 1;
    margin-right: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
    border: none;
    border-radius: 1rem;
    color: #ffffff;
  }

  .logo-card svg {
    width: 60%;
    height: auto;
  }

  .logo-plate {
    width: 72%;
    height: 72%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
  }

  .logo-plate img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-25%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track {
      animation: none;
    }
  }
</style>
</head>
