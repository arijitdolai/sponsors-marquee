  .marquee-wrap {
    width: 100%;
    overflow: hidden;
    font-family: sans-serif;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
  }

  .marquee-item {
    flex: 0 0 auto;
    font-size: 50px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    line-height: 1;
    color: #b8b1b1;
    white-space: nowrap;
    padding-right: 3rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track {
      animation: none;
    }
  }

  .marquee-outer {
    width: 100%;
    padding: 2rem 0;
  }

  .marquee-wrap {
    max-width: 100%;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 25s linear infinite;
  }

  .logo-card {
    flex-shrink: 0;
    width: 120px;
    aspect-ratio: 1 / 1;
    margin-right: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
    border: none;
    border-radius: 1rem;
  }

  .logo-card svg {
    width: 60%;
    height: auto;
  }

  .logo-plate {
    width: 72%;
    height: 72%;
    background: white;
    border-radius: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
  }

  .logo-plate img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-25%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track {
      animation: none;
    }
  }
